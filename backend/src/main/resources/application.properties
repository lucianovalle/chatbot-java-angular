server.port=8080

# Mostra a mensagem de erro no JSON quando a API responde 4xx/5xx.
server.error.include-message=always

# Onde o Ollama está e qual modelo usar.
# Troque o modelo depois de baixá-lo com: ollama pull <nome>
chat.ollama.base-url=http://localhost:11434
chat.ollama.model-name=llama3.2
chat.ollama.timeout-seconds=120
